name: Collect traffic

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

# One running collector; a pending successor waits instead of skipping itself.
concurrency:
  group: traffic-collector
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement requirements.txt
      - name: Configure publication identity
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          echo "SHIFT_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: Collect with shutdown margin
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Optional dead-man switch (HTTPS, no data sent). Pinged once a minute only while every
          # source is healthy, so a dead provider or a broken chain stops it. Grace >= 20 min.
          TRAFFIC_HEARTBEAT_URL: ${{ secrets.TRAFFIC_HEARTBEAT_URL }}
        # coreutils `timeout` ends a hung collector as a step *failure*, not a job
        # cancellation: a cancelled job would skip "Queue successor" and break the chain.
        # SIGTERM at 340 min triggers the graceful final export/publication; SIGKILL 5 min later.
        run: timeout -k 5m 340m python -m collector.shift --minutes 330 --git
      - name: Preserve recovery data on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: traffic-recovery-${{ github.run_id }}
          # The artifact exists for the journal and today's streams; frozen legacy files
          # (about 15 MB) are already in git and only make a crash loop more expensive.
          path: |
            data/
            !data/events.json
            !data/scores.csv
            !data/jam_map/*.csv
          include-hidden-files: true
          retention-days: 14
      - name: Queue successor
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        # A collector that dies within minutes (broken merge, uninstallable pin, poison payload)
        # must not re-dispatch itself every minute with a recovery artifact each time: pause first.
        # One failed dispatch call must not break the chain either: retry, then leave it to cron.
        run: |
          elapsed=$(( $(date +%s) - ${SHIFT_STARTED:-0} ))
          if [ "$COLLECT_OUTCOME" != "success" ] && [ "$elapsed" -lt 900 ]; then
            echo "::error::collector ended with '$COLLECT_OUTCOME' after ${elapsed}s; pausing 10 min before queueing the successor"
            sleep 600
          fi
          for attempt in 1 2 3; do
            if gh api -X POST "/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" -f ref=main; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          echo "::error::could not queue the successor after 3 attempts; the cron schedule has to restart the chain"
          exit 1
